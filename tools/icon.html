<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI図鑑のアイコン</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f6f5f1; }
    /* iPhone はホーム画面でアイコンの角を自分で丸めるので、四角いっぱいに描く。 */
    .icon { width: 100vw; height: 100vh; }
    .tile {
      display: grid; place-items: center; width: 100%; height: 100%;
      background: #126257; color: #f6f5f1;
      font: 800 42vw/1 -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -.04em; padding-right: .04em;
    }
  </style>
</head>
<body><div class="icon"><div class="tile">UI</div></div></body>
</html>
